name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: No dependencies, by design
        run: python -c "import sys; assert 'numpy' not in sys.modules"
      - name: Test
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest -q
      - name: End-to-end (synth -> analyse -> verify -> grade)
        run: |
          python -m craftagent synth
          python -m craftagent analyse --spec 8.5
          python -m craftagent verify
          python -m craftagent grade --auto-mask
      # 断言写成文件，不在命令行里内联：windows runner 是 PowerShell，
      # 内联引号出问题的样子是"命令找不到"，本地还复现不出来。
      - name: Parameter identification (twin coefficients from logs)
        run: |
          python -m craftagent identify
          python scripts/check_outputs.py identify
      - name: Twin assembly must pass its own acceptance
        run: |
          python -m craftagent twin
          python scripts/check_outputs.py twin
      # 这三条不是"再跑一遍测试"，是把各自的核心断言印在 CI 日志里：
      # 公差公式与手册的差、解析切深与网格切深的差、每样参数被钉在哪一档。
      # 数字变了会先被读到，而不是等到有人用错它。
      - name: Standards, boundaries and supply routes show their own error
        run: |
          python -m craftagent standards --size 10 50 100
          python -m craftagent hard --ap 2 --diameter 10 --stickout 40
          python -m craftagent supply

  # CAD 这一层单独一个 job，装 OpenCASCADE（70 MB，Linux / 52 MB，
  # Windows）。因为它装在 test job 里等于给四个矩阵格各加一刻钟，
  # 而它要验的不是"在四个平台上都能跑"，是"读进来的那块零件对不对"。
  # 不给 OCP 时 tests/test_cad.py 会 skip 并说出来 —— 这个 job 的存在
  # 就是为了让"说出来"不要变成常态。
  cad:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: OpenCASCADE (optional adapter, installed here only)
        run: python -m pip install --upgrade pip cadquery-ocp==7.8.1.1
      # 读回来的体积对着解析值 12989.3807 校验，容差 1e-6 相对。
      # 这一条如果 skip 了，说明 CAD 层其实没被验收 —— 所以下面那一步
      # 先把 skip 数读出来并断言为 0。
      - name: The CAD tests must actually run, not skip
        run: python scripts/check_cad_ran.py
      - name: Read a STEP part and check it against the analytic volume
        run: |
          python -m craftagent cad
          python -m unittest tests.test_cad -v
