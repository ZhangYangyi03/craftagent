name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: No dependencies, by design
        run: python -c "import sys; assert 'numpy' not in sys.modules"
      - name: Test
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest -q
      - name: End-to-end (synth -> analyse -> verify -> grade)
        run: |
          python -m craftagent synth
          python -m craftagent analyse --spec 8.5
          python -m craftagent verify
          python -m craftagent grade --auto-mask
      - name: Parameter identification (twin coefficients from logs)
        run: |
          python -m craftagent identify
          python -c "import json;d=json.load(open('out/identify.json'));assert d['machines'],'no machines';assert d['needs'],'needs list must not be empty';print('ok', list(d['machines']))"
      - name: Twin assembly must pass its own acceptance
        run: |
          python -m craftagent twin
          python -c "import json;d=json.load(open('out/twin.json'));h=d['machines']['M02'];bad=[c for c,r in h['validation'].items() if not r['beats_baseline']];assert not bad,'healthy machine channels must beat the flat baseline: %s'%bad;m=d['machines']['M01'];assert m['rejected'],'a drifting machine must have channels rejected';print('ok twin')"
